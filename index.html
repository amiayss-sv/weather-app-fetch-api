
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-900 via-blue-700 to-sky-500 flex items-center justify-center p-4">

    <main class="w-full max-w-md">

        <h1 class="text-3xl font-bold text-white text-center mb-8">
            🌤 Weather App
        </h1>

        <form class="weatherForm flex gap-2 mb-6" id="form">

            <div class="flex-1">
                <label for="city" class="sr-only">Ville</label>

                <input
                    type="text"
                    id="city"
                    class="cityInput w-full px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-yellow-400 text-gray-800"
                    placeholder="Entrer une ville..."
                >
            </div>

            <button
                type="submit"
                class="bg-yellow-400 hover:bg-yellow-300 text-blue-900 font-bold px-5 py-3 rounded-xl transition"
                id="btn"
            >
                Rechercher
            </button>

        </form>
        

        <!-- Message de chargement -->
        <p class="text-blue-600 font-semibold text-center mb-3"
           id="loading" hidden>
            Chargement...
        </p>

        <!-- Message d'erreur -->
        <p class="text-red-500 font-semibold text-center mb-3 hidden"
           id="mesgerror">
            Veuillez saisir une ville
        </p>

     <div class="flex justify-center mb-6">
        
    <button 
        id="retryBtn" 
        class="hidden bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-2 rounded-xl shadow-md transition duration-300 hover:scale-105"
    >
        🔄 Réessayer
    </button>
    </div>
        <!-- Carte météo dynamique -->
        <div
            id="weatherCard"
            class="card bg-white rounded-3xl shadow-2xl p-8 text-center"
        >
            <p class="text-gray-500">
                Recherchez une ville pour afficher sa météo.
            </p>
        </div>

        
<!-- Section des prévisions météo des 5 prochains jours -->
<section
    id="forecastSection"
    class="mt-6 bg-white rounded-3xl shadow-2xl p-6 hidden"
>
    <h2 class="text-xl font-bold text-gray-800 text-center mb-5">
        Prévisions des 5 prochains jours
    </h2>

    <!-- Les cartes des prévisions seront ajoutées ici avec JavaScript -->
    <div id="forecastContainer" class="grid grid-cols-1 gap-3">
    </div>
</section>


    </main>

    <script src="script.js"></script>

</body>
</html>
