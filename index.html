
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-900 via-blue-700 to-sky-500 flex items-center justify-center p-4">

    <main class="w-full max-w-md">

        <h1 class="text-3xl font-bold text-white text-center mb-8">
            🌤 Weather App
        </h1>

        <form class="weatherForm flex gap-2 mb-6" id="form">

            <div class="flex-1">
                <label for="city" class="sr-only">Ville</label>

                <input
                    type="text"
                    id="city"
                    class="cityInput w-full px-4 py-3 rounded-xl outline-none focus:ring-2 focus:ring-yellow-400 text-gray-800"
                    placeholder="Entrer une ville..."
                >
            </div>

            <button
                type="submit"
                class="bg-yellow-400 hover:bg-yellow-300 text-blue-900 font-bold px-5 py-3 rounded-xl transition"
                id="btn"
            >
                Rechercher
            </button>

        </form>

        <div class="card bg-white rounded-3xl shadow-2xl p-8 text-center">

            <h2 class="cityDisplay text-2xl font-bold text-gray-800 mb-4">
                Rabat
            </h2>

            <p class="weatherEmoji text-6xl mb-4">
                ☀️
            </p>

            <p class="tempDisplay text-5xl font-bold text-blue-700 mb-4">
                21°C
            </p>

            <p class="descDisplay text-lg text-gray-600 capitalize mb-3">
                Clear skies
            </p>

            <p class="humidityDisplay text-gray-600 mb-4">
                Humidity : 99%
            </p>

            <p class="loadingDisplay hidden text-blue-600 font-semibold">
                Chargement...
            </p>

            
            <p class="errorDisplay text-red-500 font-semibold hidden" id="mesgerror">
                Veuillez saisir une ville
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
